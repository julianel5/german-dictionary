[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "german-dictionary"
version = "0.1.0"
description = "A modern, fast, ad-free German dictionary for language learners"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<9",
    "spacy>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "services/morphology/german_morphology", "scripts"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api", "services/morphology"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "german_morphology", "scripts"]
